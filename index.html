<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>GGoogle</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* ── Variables ─────────────────────────────────────── */
  :root {
    --bg:        #0e0e0e;
    --bg2:       #181818;
    --bg3:       #222222;
    --border:    #2a2a2a;
    --accent:    #3de87a;
    --accent2:   #22c55e;
    --text:      #f0f0f0;
    --muted:     #888;
    --card-r:    16px;
    --nav-h:     64px;
    --safe-b:    env(safe-area-inset-bottom, 0px);
  }

  /* ── Reset ─────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; background: var(--bg); color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  /* ── App shell ─────────────────────────────────────── */
  #app {
    display: flex; flex-direction: column;
    height: 100dvh; overflow: hidden;
  }
  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    position: sticky; top: 0; z-index: 10;
    flex-shrink: 0;
  }
  .logo {
    font-size: 20px; font-weight: 800; letter-spacing: .5px;
    color: var(--accent);
  }
  .header-sub { font-size: 11px; color: var(--muted); }
  .back-btn {
    background: none; border: none; color: var(--accent);
    font-size: 13px; font-weight: 600; cursor: pointer;
    padding: 4px 8px; border-radius: 8px;
    display: none; align-items: center; gap: 4px;
  }
  .back-btn.visible { display: flex; }
  .back-btn svg { width: 16px; height: 16px; }

  /* ── Scroll area ───────────────────────────────────── */
  .scroll-area {
    flex: 1; overflow-y: auto; overscroll-behavior: contain;
    padding-bottom: calc(var(--nav-h) + var(--safe-b) + 16px);
  }
  .scroll-area::-webkit-scrollbar { display: none; }

  /* ── Pages ─────────────────────────────────────────── */
  .page { display: none; animation: fadeIn .18s ease; }
  .page.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* ── Section title ─────────────────────────────────── */
  .section-title {
    font-size: 20px; font-weight: 700;
    padding: 18px 16px 10px;
  }

  /* ── Category grid ─────────────────────────────────── */
  .cat-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 12px; padding: 0 14px 8px;
  }
  .cat-card {
    background: var(--bg2); border-radius: var(--card-r);
    border: 1px solid var(--border);
    cursor: pointer; overflow: hidden;
    transition: transform .12s, border-color .12s;
    active: transform .08s;
  }
  .cat-card:active { transform: scale(.97); border-color: var(--accent); }
  .cat-icon-wrap {
    background: var(--bg3);
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    font-size: 48px;
    border-radius: calc(var(--card-r) - 2px) calc(var(--card-r) - 2px) 0 0;
  }
  .cat-name {
    font-size: 13px; font-weight: 600;
    padding: 10px 10px 12px;
    line-height: 1.3;
  }

  /* ── Product list ──────────────────────────────────── */
  .product-list { padding: 0 14px; display: flex; flex-direction: column; gap: 10px; }
  .product-card {
    background: var(--bg2); border-radius: var(--card-r);
    border: 1px solid var(--border);
    display: flex; gap: 12px; padding: 12px;
    cursor: pointer; transition: border-color .12s;
    align-items: flex-start;
  }
  .product-card:active { border-color: var(--accent); }
  .product-img {
    width: 72px; height: 72px; flex-shrink: 0;
    border-radius: 10px; object-fit: cover;
    background: var(--bg3); display: flex; align-items: center; justify-content: center;
    font-size: 28px; color: var(--muted);
    overflow: hidden;
  }
  .product-img img { width: 100%; height: 100%; object-fit: cover; }
  .product-info { flex: 1; min-width: 0; }
  .product-name {
    font-size: 13px; font-weight: 600; line-height: 1.35;
    margin-bottom: 4px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .product-desc {
    font-size: 11px; color: var(--muted); line-height: 1.4;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    margin-bottom: 6px;
  }
  .product-footer { display: flex; align-items: center; justify-content: space-between; }
  .product-price { font-size: 16px; font-weight: 700; color: var(--accent); }
  .buy-btn {
    background: var(--accent); color: #000;
    font-size: 12px; font-weight: 700;
    border: none; border-radius: 8px;
    padding: 6px 14px; cursor: pointer;
    transition: opacity .1s;
  }
  .buy-btn:active { opacity: .8; }
  .out-of-stock { opacity: .5; pointer-events: none; }
  .badge-oos {
    font-size: 10px; background: #444; color: var(--muted);
    border-radius: 6px; padding: 4px 8px; font-weight: 600;
  }

  /* ── Modal ─────────────────────────────────────────── */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,.7);
    backdrop-filter: blur(4px);
    display: none; align-items: flex-end;
    animation: fadeIn .15s;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--bg2);
    border-radius: 24px 24px 0 0;
    width: 100%; max-height: 88dvh;
    overflow-y: auto; overscroll-behavior: contain;
    padding: 0 0 calc(20px + var(--safe-b));
    animation: slideUp .2s cubic-bezier(.22,1,.36,1);
  }
  @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  .modal-header {
    position: sticky; top: 0; z-index: 1;
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 16px 12px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
  }
  .modal-title { font-size: 15px; font-weight: 700; max-width: 80%; line-height: 1.3; }
  .close-btn {
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--bg3); border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 18px; flex-shrink: 0;
  }
  .modal-img {
    width: 100%; height: 160px; object-fit: cover;
    background: var(--bg3); display: flex; align-items: center; justify-content: center;
    font-size: 56px; overflow: hidden;
  }
  .modal-img img { width: 100%; height: 100%; object-fit: cover; }
  .modal-body { padding: 16px; }
  .modal-desc {
    font-size: 13px; color: var(--muted); line-height: 1.6;
    white-space: pre-wrap; margin-bottom: 20px;
  }

  /* ── Quantity ──────────────────────────────────────── */
  .qty-label { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 10px; }
  .qty-row { display: flex; align-items: center; gap: 16px; margin-bottom: 8px; }
  .qty-btn {
    width: 38px; height: 38px; border-radius: 50%;
    border: 2px solid var(--border); background: var(--bg3);
    color: var(--text); font-size: 20px; font-weight: 300;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0; transition: border-color .1s;
  }
  .qty-btn:active { border-color: var(--accent); }
  .qty-input {
    flex: 1; background: var(--bg3); border: 1px solid var(--border);
    border-radius: 10px; color: var(--text);
    font-size: 18px; font-weight: 700; text-align: center;
    padding: 8px; outline: none;
    -moz-appearance: textfield;
  }
  .qty-input::-webkit-outer-spin-button,
  .qty-input::-webkit-inner-spin-button { -webkit-appearance: none; }
  input[type=range] {
    -webkit-appearance: none; width: 100%; height: 4px;
    background: var(--bg3); border-radius: 2px; outline: none;
    margin-bottom: 6px;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%;
    background: var(--accent); cursor: pointer;
    box-shadow: 0 0 0 3px rgba(61,232,122,.2);
  }
  .range-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-bottom: 20px; }

  /* ── Price block ───────────────────────────────────── */
  .price-block {
    background: var(--bg3); border-radius: 14px;
    padding: 14px 16px; margin-bottom: 16px;
    border: 1px solid var(--border);
  }
  .price-row { display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: var(--muted); margin-bottom: 6px; }
  .price-total-row { display: flex; justify-content: space-between; align-items: center; }
  .price-total-label { font-size: 16px; font-weight: 600; }
  .price-total-val { font-size: 22px; font-weight: 800; color: var(--accent); }

  /* ── Order btn ─────────────────────────────────────── */
  .order-btn {
    width: 100%; padding: 16px;
    background: var(--accent); color: #000;
    font-size: 15px; font-weight: 800; letter-spacing: .3px;
    border: none; border-radius: 14px; cursor: pointer;
    transition: opacity .1s;
  }
  .order-btn:active { opacity: .85; }
  .order-btn:disabled { opacity: .5; cursor: not-allowed; }

  /* ── Profile page ──────────────────────────────────── */
  .profile-card {
    margin: 16px; background: var(--bg2); border-radius: var(--card-r);
    border: 1px solid var(--border); overflow: hidden;
  }
  .profile-avatar {
    width: 72px; height: 72px; border-radius: 50%;
    background: var(--bg3); display: flex; align-items: center; justify-content: center;
    font-size: 32px; flex-shrink: 0;
  }
  .profile-top {
    padding: 20px; display: flex; gap: 16px; align-items: center;
    border-bottom: 1px solid var(--border);
  }
  .profile-name { font-size: 17px; font-weight: 700; }
  .profile-id { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .support-btn {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 20px; cursor: pointer;
    font-size: 14px; font-weight: 600;
    transition: background .1s;
  }
  .support-btn:active { background: var(--bg3); }
  .support-icon { font-size: 20px; }
  .support-sub { font-size: 12px; color: var(--muted); font-weight: 400; }

  /* ── Bottom nav ────────────────────────────────────── */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    height: calc(var(--nav-h) + var(--safe-b));
    padding-bottom: var(--safe-b);
    background: var(--bg2);
    border-top: 1px solid var(--border);
    display: flex; z-index: 50;
  }
  .nav-item {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 3px;
    cursor: pointer; transition: color .12s;
    color: var(--muted); font-size: 11px; font-weight: 600;
    padding-bottom: 2px;
  }
  .nav-item.active { color: var(--accent); }
  .nav-icon { font-size: 22px; line-height: 1; }

  /* ── Loader ────────────────────────────────────────── */
  .loader {
    display: flex; justify-content: center; padding: 48px 0;
  }
  .spinner {
    width: 32px; height: 32px; border: 3px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty { text-align: center; color: var(--muted); padding: 48px 16px; font-size: 14px; }
</style>
</head>
<body>
<div id="app">

  <!-- Header -->
  <div class="header">
    <div>
      <div class="logo">GGoogle</div>
    </div>
    <button class="back-btn" id="backBtn" onclick="goBack()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
      Назад
    </button>
  </div>

  <!-- Scroll area -->
  <div class="scroll-area">

    <!-- Page: Categories -->
    <div class="page active" id="page-catalog">
      <div class="section-title">Категории</div>
      <div class="cat-grid" id="catGrid">
        <div class="loader"><div class="spinner"></div></div>
      </div>
    </div>

    <!-- Page: Products -->
    <div class="page" id="page-products">
      <div class="section-title" id="prodTitle">Товары</div>
      <div class="product-list" id="productList"></div>
    </div>

    <!-- Page: Profile -->
    <div class="page" id="page-profile">
      <div class="section-title">Профиль</div>
      <div class="profile-card">
        <div class="profile-top">
          <div class="profile-avatar">👤</div>
          <div>
            <div class="profile-name" id="profileName">Загрузка...</div>
            <div class="profile-id" id="profileId"></div>
          </div>
        </div>
        <div class="support-btn" onclick="openSupport()">
          <span class="support-icon">💬</span>
          <div>
            <div>Написать в поддержку</div>
            <div class="support-sub">Вопросы по заказам и оплате</div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- Bottom Nav -->
  <div class="bottom-nav">
    <div class="nav-item active" id="nav-catalog" onclick="switchTab('catalog')">
      <div class="nav-icon">🛒</div>
      <span>Каталог</span>
    </div>
    <div class="nav-item" id="nav-profile" onclick="switchTab('profile')">
      <div class="nav-icon">👤</div>
      <span>Профиль</span>
    </div>
  </div>

</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle"></div>
      <button class="close-btn" onclick="closeModalDirect()">✕</button>
    </div>
    <div class="modal-img" id="modalImg"></div>
    <div class="modal-body">
      <div class="modal-desc" id="modalDesc"></div>

      <div class="qty-label">Количество</div>
      <div class="qty-row">
        <button class="qty-btn" onclick="changeQty(-1)">−</button>
        <input class="qty-input" type="number" id="qtyInput" value="1" min="1" max="10" oninput="syncQty('input')"/>
        <button class="qty-btn" onclick="changeQty(1)">+</button>
      </div>
      <input type="range" id="qtyRange" min="1" max="10" value="1" oninput="syncQty('range')"/>
      <div class="range-labels">
        <span>1</span>
        <span id="rangeMax">10</span>
      </div>

      <div class="price-block">
        <div class="price-row">
          <span>Цена за 1 шт.</span>
          <span id="unitPrice">—</span>
        </div>
        <div class="price-row">
          <span>Количество</span>
          <span id="qtyDisplay">×1</span>
        </div>
        <div class="price-total-row">
          <span class="price-total-label">Итого</span>
          <span class="price-total-val" id="totalPrice">0 $</span>
        </div>
      </div>

      <button class="order-btn" id="orderBtn" onclick="placeOrder()">
        ОФОРМИТЬ ЗАКАЗ
      </button>
    </div>
  </div>
</div>

<script>
// ── Telegram WebApp init ──────────────────────────────────────
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  tg.setHeaderColor('#0e0e0e');
  tg.setBackgroundColor('#0e0e0e');
}

// ╔══════════════════════════════════════════════════════════════╗
// ║         КАТАЛОГ ТОВАРОВ — РЕДАКТИРУЙ ЗДЕСЬ                  ║
// ╚══════════════════════════════════════════════════════════════╝
const CATALOG_DATA = [
  {
    id: 1,
    name: "Фармы / Кинги ФБ",
    emoji: "👑",
    products: [
      {
        id: 101,
        name: "Google FARM 14 дней Ukraine | Без Google ADS | 2FA Г200",
        description: "Гео: Украина\nFarm 14 дней + время без активности\nФормат: логин:пароль:токен:куки",
        price: 9.00,
        max_qty: 15,
        image_url: "",
        in_stock: true
      },
      {
        id: 102,
        name: "Google Farm | UA | 21d +6 месяцев отлежки | ФИЗ СИМ P445",
        description: "Рега секретным способом - не летят на апилы\nФормат: логин:пароль:токен",
        price: 18.00,
        max_qty: 10,
        image_url: "",
        in_stock: true
      }
    ]
  },
  {
    id: 2,
    name: "Фан Пейдж",
    emoji: "⭐",
    products: [
      {
        id: 201,
        name: "FB Фан Пейдж с PZRD | BEZ",
        description: "Подтверждён по смс\nПодтверждён по почте\nФормат: логин:пароль:куки",
        price: 5.00,
        max_qty: 20,
        image_url: "",
        in_stock: true
      }
    ]
  },
  {
    id: 3,
    name: "Бизнес Менеджеры",
    emoji: "💎",
    products: [
      {
        id: 301,
        name: "БМ чистый | Верифицирован | UA",
        description: "Чистый бизнес менеджер\nВерифицирован\nГео: Украина",
        price: 12.00,
        max_qty: 5,
        image_url: "",
        in_stock: true
      }
    ]
  },
  {
    id: 4,
    name: "Автореги FB",
    emoji: "🤖",
    products: [
      {
        id: 401,
        name: "GB Авторег GB / почта:пароль",
        description: "Могут быть частично запенены\nТокен EAAB\nПодтверждены по смс\nПодтверждены по почте\nФормат: логин:пароль:ид:почта:токен:куки:2ф",
        price: 1.30,
        max_qty: 15,
        image_url: "",
        in_stock: true
      }
    ]
  }
];
// ══════════════════════════════════════════════════════════════

let catalog = CATALOG_DATA;
let currentCatId = null;
let currentProduct = null;
let currentTab = 'catalog';
let breadcrumb = [];

async function fetchCatalog() { /* данные уже вшиты выше */ }

// ── Pages ─────────────────────────────────────────────────────
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(`page-${id}`).classList.add('active');
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById(`nav-${tab}`).classList.add('active');
  document.getElementById('backBtn').classList.remove('visible');
  breadcrumb = [];

  if (tab === 'catalog') {
    showPage('catalog');
  } else if (tab === 'profile') {
    renderProfile();
    showPage('profile');
  }
}

function goBack() {
  if (breadcrumb.length > 0) {
    breadcrumb.pop();
    if (breadcrumb.length === 0) {
      document.getElementById('backBtn').classList.remove('visible');
      showPage('catalog');
    } else {
      // go back to categories
      document.getElementById('backBtn').classList.remove('visible');
      showPage('catalog');
    }
  }
}

// ── Render categories ─────────────────────────────────────────
function renderCategories() {
  const grid = document.getElementById('catGrid');
  if (!catalog.length) {
    grid.innerHTML = '<div class="empty" style="grid-column:1/-1">Категорий пока нет.<br>Скоро откроемся!</div>';
    return;
  }
  grid.innerHTML = catalog.map(cat => `
    <div class="cat-card" onclick="openCategory(${cat.id})">
      <div class="cat-icon-wrap">${cat.emoji || '📦'}</div>
      <div class="cat-name">${cat.name}</div>
    </div>
  `).join('');
}

// ── Open category ─────────────────────────────────────────────
function openCategory(catId) {
  const cat = catalog.find(c => c.id === catId);
  if (!cat) return;
  currentCatId = catId;
  breadcrumb.push('catalog');
  document.getElementById('prodTitle').textContent = `${cat.emoji} ${cat.name}`;
  renderProducts(cat.products || []);
  showPage('products');
  document.getElementById('backBtn').classList.add('visible');
  if (tg) tg.HapticFeedback?.impactOccurred('light');
}

// ── Render products ───────────────────────────────────────────
function renderProducts(products) {
  const list = document.getElementById('productList');
  if (!products.length) {
    list.innerHTML = '<div class="empty">В этой категории пока нет товаров.</div>';
    return;
  }
  list.innerHTML = products.map(p => {
    const oos = !p.in_stock;
    const imgHtml = p.image_url
      ? `<div class="product-img"><img src="${p.image_url}" alt="" loading="lazy" onerror="this.parentNode.innerHTML='🖼'"/></div>`
      : `<div class="product-img">🖼</div>`;
    const action = oos
      ? `<span class="badge-oos">Нет в наличии</span>`
      : `<button class="buy-btn" onclick="openProduct(${p.id}, event)">КУПИТЬ</button>`;
    return `
      <div class="product-card ${oos ? 'out-of-stock' : ''}" onclick="${oos ? '' : `openProduct(${p.id})`}">
        ${imgHtml}
        <div class="product-info">
          <div class="product-name">${p.name}</div>
          <div class="product-desc">${p.description || ''}</div>
          <div class="product-footer">
            <div class="product-price">${formatPrice(p.price)}</div>
            ${action}
          </div>
        </div>
      </div>
    `;
  }).join('');
}

// ── Open product modal ────────────────────────────────────────
function openProduct(productId, e) {
  if (e) e.stopPropagation();
  const cat = catalog.find(c => c.id === currentCatId);
  const product = cat?.products?.find(p => p.id === productId);
  if (!product) return;
  currentProduct = product;

  const maxQty = product.max_qty || 10;
  document.getElementById('modalTitle').textContent = product.name;

  // Image
  const imgEl = document.getElementById('modalImg');
  imgEl.innerHTML = product.image_url
    ? `<img src="${product.image_url}" alt="" onerror="this.parentNode.innerHTML='🖼'"/>`
    : '🖼';

  document.getElementById('modalDesc').textContent = product.description || '';

  // Qty
  const range = document.getElementById('qtyRange');
  const input = document.getElementById('qtyInput');
  range.max = maxQty;
  range.value = 1;
  input.max = maxQty;
  input.value = 1;
  document.getElementById('rangeMax').textContent = maxQty;

  updatePriceDisplay();
  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
  if (tg) tg.HapticFeedback?.impactOccurred('medium');
}

function closeModal(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModalDirect();
}
function closeModalDirect() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

// ── Qty sync ─────────────────────────────────────────────────
function syncQty(source) {
  const range = document.getElementById('qtyRange');
  const input = document.getElementById('qtyInput');
  const max = parseInt(range.max);
  if (source === 'range') {
    input.value = range.value;
  } else {
    let v = Math.min(Math.max(parseInt(input.value) || 1, 1), max);
    input.value = v;
    range.value = v;
  }
  updatePriceDisplay();
}

function changeQty(delta) {
  const input = document.getElementById('qtyInput');
  const range = document.getElementById('qtyRange');
  const max = parseInt(range.max);
  let v = Math.min(Math.max((parseInt(input.value) || 1) + delta, 1), max);
  input.value = v;
  range.value = v;
  updatePriceDisplay();
  if (tg) tg.HapticFeedback?.selectionChanged();
}

function updatePriceDisplay() {
  if (!currentProduct) return;
  const qty = parseInt(document.getElementById('qtyInput').value) || 1;
  const price = currentProduct.price;
  const total = (price * qty).toFixed(2);
  document.getElementById('unitPrice').textContent = formatPrice(price);
  document.getElementById('qtyDisplay').textContent = `×${qty}`;
  document.getElementById('totalPrice').textContent = `${total} $`;
  document.getElementById('orderBtn').textContent = `ОФОРМИТЬ ЗАКАЗ ${qty} ШТ.`;
}

// ── Place order ───────────────────────────────────────────────
function placeOrder() {
  if (!currentProduct || !tg) return;
  const qty = parseInt(document.getElementById('qtyInput').value) || 1;
  const orderData = {
    product_id: currentProduct.id,
    product_name: currentProduct.name,
    quantity: qty,
    price_per: currentProduct.price,
    total: parseFloat((currentProduct.price * qty).toFixed(2))
  };

  const btn = document.getElementById('orderBtn');
  btn.disabled = true;
  btn.textContent = 'Отправка...';

  tg.sendData(JSON.stringify(orderData));
  closeModalDirect();
  tg.HapticFeedback?.notificationOccurred('success');
  // bot will handle the data and reply
}

// ── Profile ───────────────────────────────────────────────────
function renderProfile() {
  const user = tg?.initDataUnsafe?.user;
  if (user) {
    document.getElementById('profileName').textContent =
      [user.first_name, user.last_name].filter(Boolean).join(' ') || 'Пользователь';
    document.getElementById('profileId').textContent =
      `@${user.username || '—'}  ·  ID: ${user.id}`;
  } else {
    document.getElementById('profileName').textContent = 'Пользователь';
    document.getElementById('profileId').textContent = '';
  }
}

function openSupport() {
  if (tg) tg.openTelegramLink('https://t.me/YOUR_SUPPORT_USERNAME');
}

// ── Helpers ───────────────────────────────────────────────────
function formatPrice(p) {
  return Number.isInteger(p) ? `${p} $` : `${p.toFixed(2)} $`;
}

// ── Init ──────────────────────────────────────────────────────
(async () => {
  await fetchCatalog();
  renderCategories();
})();
</script>
</body>
</html>
